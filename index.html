<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAZENTA.C | 정득묵 온라인 뮤지엄</title>
    <style>
        /* 1. 브랜드 컬러 시스템 및 초기화 */
        :root {
            --point-color: #be0066; /* 기획 최적화 와인 마젠타 */
            --bg-black: #0D0D0D;    /* Obsidian Black */
            --bg-white: #F8F8F8;    /* Bone White */
            --text-gray: #666666;
            --text-light: #dbdbdb;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background-color: var(--bg-black);
            color: var(--bg-black);
            font-family: 'Noto Serif KR', serif;
            overflow-x: hidden;
            cursor: none; /* 시스템 기본 커서 완전 은폐 */
        }

        /* 2. 고도화된 십자형 레이저 커서 (Crosshair Razor Cursor) */
        #razor-cursor-h, #razor-cursor-v {
            position: fixed;
            background-color: var(--point-color);
            pointer-events: none;
            z-index: 9999;
            transition: transform 0.05s ease-out;
            will-change: transform;
        }
        #razor-cursor-h { width: 40px; height: 1px; left: -20px; top: 0; }
        #razor-cursor-v { width: 1px; height: 40px; left: 0; top: -20px; }

        /* 3. 과감한 여백의 상단 헤더 */
        header {
            width: 100%;
            padding: 40px 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: transparent;
            position: absolute;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--bg-white);
            mix-blend-mode: difference;
        }

        .menu-trigger {
            font-size: 1.5rem;
            color: var(--bg-white);
            mix-blend-mode: difference;
            cursor: none;
        }

        /* 4. 시네마틱 레터박스 16:9 크롭 히어로 섹션 */
        .hero-section {
            position: relative;
            width: 100%;
            height: 100vh;
            background-color: var(--bg-black);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .cinematic-container {
            position: relative;
            width: 100%;
            max-width: 100%;
            aspect-ratio: 16 / 9;
            background-color: #000;
            overflow: hidden;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.8);
        }

        .video-background {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100%;
            height: 100%;
            transform: translate(-50%, -50%) scale(1.02);
            pointer-events: none;
        }

        .video-background iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .hero-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, rgba(13, 13, 13, 0.5), rgba(13, 13, 13, 0.75));
            z-index: 2;
        }

        .hero-content {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0 10%;
        }

        .hero-title {
            font-size: 2.7rem; /* 수정 요청 스케일 고정 */
            font-weight: 300;
            line-height: 1.6;
            text-align: center;
            margin-bottom: 25px;
            color: var(--text-light); /* 연한 그레이 색상 전환 */
            text-shadow: 0 4px 30px rgba(0, 0, 0, 0.8);
            word-break: keep-all;
        }

        .hero-title span {
            color: var(--point-color);
            font-weight: 700;
            letter-spacing: 0.05em;
            margin-top: 0; /* 마진 탑 배제 */
        }

        .hero-subtitle {
            font-size: 1rem;
            letter-spacing: 5px;
            color: #dddddd;
            text-align: center;
            padding: 24px; /* 사방 패딩 가치 부여 */
            text-shadow: 0 2px 15px rgba(0, 0, 0, 0.7);
        }

        /* 5. 행 기준 자유 그리드 및 스플릿 명세서 공간 */
        .archive-section {
            width: 100%;
            padding: 140px 60px;
            background-color: var(--bg-white);
            color: var(--bg-black);
        }

        .section-title {
            font-size: 2rem;
            margin-bottom: 60px;
            letter-spacing: 2px;
            border-left: 3px solid var(--point-color);
            padding-left: 20px;
            color: var(--bg-black);
        }

        /* 스플릿 쇼케이스 구조 (좌측 롤링 슬라이드, 우측 고정 명세 캔버스) */
        .museum-split-showcase {
            display: flex;
            width: 100%;
            height: 520px;
            gap: 40px;
            margin-bottom: 60px;
        }

        /* 좌측: 1~5.jpg 자동 페이드 무한 롤링 엔진 슬라이더 */
        .archive-slider-box {
            flex: 1.2;
            position: relative;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0,0,0,0.15);
        }

        .slider-wrapper {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .slide-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            visibility: hidden;
            transition: opacity 1s cubic-bezier(0.16, 1, 0.3, 1), visibility 1s;
        }

        .slide-img.active {
            opacity: 1;
            visibility: visible;
        }

        /* 우측: 도슨트 스크립트 기반 명세 테이블 스페이스 */
        .archive-description-box {
            flex: 0.8;
            height: 100%;
            background-color: var(--bg-black);
            color: var(--bg-white);
            padding: 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            border-left: 4px solid var(--point-color); /* 예리한 절단면 선 격조 */
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
        }

        .desc-header {
            font-size: 1.6rem;
            font-weight: 600;
            letter-spacing: 1px;
            color: var(--bg-white);
            margin-bottom: 35px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 15px;
        }

        .spec-table {
            width: 100%;
        }

        .spec-row {
            display: flex;
            justify-content: space-between;
            padding: 14px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-size: 0.95rem;
        }

        .spec-label {
            font-family: monospace;
            color: var(--point-color);
            font-weight: bold;
            letter-spacing: 1px;
        }

        .spec-value {
            font-weight: 300;
            color: var(--text-light);
            text-align: right;
        }
    </style>
</head>
<body>

    <div id="razor-cursor-h"></div>
    <div id="razor-cursor-v"></div>

    <header>
        <div class="logo">MAZENTA.C</div>
        <div class="menu-trigger">☰</div>
    </header>

    <section class="hero-section">
        <div class="cinematic-container">
            <div class="video-background">
                <iframe src="https://www.youtube.com/embed/9ZkDOZpzyhs?autoplay=1&mute=1&loop=1&playlist=9ZkDOZpzyhs&controls=0&start=266&modestbranding=1&showinfo=0&rel=0&iv_load_policy=3" allow="autoplay; encrypted-media" allowfullscreen></iframe>
            </div>
            <div class="hero-overlay"></div>
            
            <div class="hero-content">
                <h1 class="hero-title">
                    이상과 현실에서 고민하고 느꼈던 수없이 많은 생각<br>
                    무엇도 아니지만 무엇도 될 수 있는<br>
                    <span>나는 경계다. 나는 칼이다.</span>
                </h1>
                <p class="hero-subtitle">1994 - 2026 : 장인을 넘어선 예술가, 정득묵</p>
            </div>
        </div>
    </section>

    <section class="archive-section">
        <h2 class="section-title">DIGITAL MUSEUM ARCHIVE</h2>
        
        <div class="museum-split-showcase">
            <div class="archive-slider-box">
                <div class="slider-wrapper">
                    <img src="jpg/1.jpg" alt="Iron Meteorite Knife 1" class="slide-img active">
                    <img src="jpg/2.jpg" alt="Iron Meteorite Knife 2" class="slide-img">
                    <img src="jpg/3.jpg" alt="Iron Meteorite Knife 3" class="slide-img">
                    <img src="jpg/4.jpg" alt="Iron Meteorite Knife 4" class="slide-img">
                    <img src="jpg/5.jpg" alt="Iron Meteorite Knife 5" class="slide-img">
                </div>
            </div>

            <div class="archive-description-box">
                <h3 class="desc-header">[IRON METEORITE KNIFE]</h3>
                <div class="spec-table">
                    <div class="spec-row">
                        <span class="spec-label">* blade</span>
                        <span class="spec-value">iron meteorite</span>
                    </div>
                    <div class="spec-row">
                        <span class="spec-label">* guard</span>
                        <span class="spec-value">stainless steel</span>
                    </div>
                    <div class="spec-row">
                        <span class="spec-label">* ferrule</span>
                        <span class="spec-value">diamond on silver</span>
                    </div>
                    <div class="spec-row">
                        <span class="spec-label">* handle</span>
                        <span class="spec-value">silver wire, copper wire on stone</span>
                    </div>
                    <div class="spec-row">
                        <span class="spec-label">* cap</span>
                        <span class="spec-value">diamond on silver</span>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script>
        const cursorH = document.getElementById('razor-cursor-h');
        const cursorV = document.getElementById('razor-cursor-v');

        window.addEventListener('mousemove', (e) => {
            cursorH.style.transform = `translate3d(${e.clientX}px, ${e.clientY}px, 0)`;
            cursorV.style.transform = `translate3d(${e.clientX}px, ${e.clientY}px, 0)`;
        });

        // 좌측 이미지 무한 롤링 엔진 (3초 간격 페이드 크로스오버 처리)
        const slides = document.querySelectorAll('.slide-img');
        let currentSlideIndex = 0;

        function nextSlide() {
            slides[currentSlideIndex].classList.remove('active');
            currentSlideIndex = (currentSlideIndex + 1) % slides.length;
            slides[currentSlideIndex].classList.add('active');
        }

        if(slides.length > 0) {
            setInterval(nextSlide, 3000);
        }
    </script>
</body>
</html>

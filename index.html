<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAZENTA.C | 정득묵 온라인 뮤지엄</title>
    <style>
        /* 1. 브랜드 컬러 시스템 및 초기화 */
        :root {
            --point-color: #8B004B; /* Deep Magenta */
            --bg-black: #0D0D0D;    /* Obsidian Black */
            --bg-white: #F8F8F8;    /* Bone White */
            --text-gray: #666666;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background-color: var(--bg-black); /* 전체 배경을 흑요석 블랙으로 통일하여 여백과 싱크 */
            color: var(--bg-black);
            font-family: 'Noto Serif KR', serif;
            overflow-x: hidden;
            cursor: none; /* 시스템 기본 커서 완전 은폐 */
        }

        /* 2. 고도화된 십자형 레이저 커서 (Crosshair Razor Cursor) */
        #razor-cursor-h, #razor-cursor-v {
            position: fixed;
            background-color: var(--point-color);
            pointer-events: none;
            z-index: 9999;
            transition: transform 0.05s ease-out;
            will-change: transform;
        }
        #razor-cursor-h {
            width: 40px;
            height: 1px;
            left: -20px;
            top: 0;
        }
        #razor-cursor-v {
            width: 1px;
            height: 40px;
            left: 0;
            top: -20px;
        }

        /* 3. 과감한 여백의 상단 헤더 */
        header {
            width: 100%;
            padding: 40px 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: transparent;
            position: absolute;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--bg-white);
            mix-blend-mode: difference;
        }

        .menu-trigger {
            font-size: 1.5rem;
            color: var(--bg-white);
            mix-blend-mode: difference;
            cursor: none;
        }

        /* 4. 시네마틱 레터박스 16:9 크롭 히어로 섹션 */
        .hero-section {
            position: relative;
            width: 100%;
            height: 100vh;
            background-color: var(--bg-black); /* 레터박스가 될 상하 블랙 여백 공간 */
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* 16:9 비율을 엄격히 고수하는 시네마틱 컨테이너 고정 크롭 박스 */
        .cinematic-container {
            position: relative;
            width: 100%;
            max-width: 100%;
            aspect-ratio: 16 / 9; /* 명확한 16:9 극장 화면비 강제 */
            background-color: #000;
            overflow: hidden;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.8);
        }

        /* 크롭 박스 내부 유튜브 프레임 구조 */
        .video-background {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100%;
            height: 100%;
            transform: translate(-50%, -50%) scale(1.02); /* 미세 아웃라인 간섭 방지 스케일링 */
            pointer-events: none;
        }

        .video-background iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* 명품 박물관 톤 다운 그라데이션 필터 overlay */
        .hero-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, rgba(13, 13, 13, 0.5), rgba(13, 13, 13, 0.75));
            z-index: 2;
        }

        /* 히어로 전면 텍스트 레이어 */
        .hero-content {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0 10%;
        }

        .hero-title {
            font-size: 4rem;
            font-weight: 300;
            line-height: 1.3;
            text-align: center;
            margin-bottom: 25px;
            color: var(--bg-white);
            text-shadow: 0 4px 30px rgba(0, 0, 0, 0.8);
        }

        .hero-title span {
            color: var(--point-color);
            font-weight: 700;
        }

        .hero-subtitle {
            font-size: 1rem;
            letter-spacing: 5px;
            color: #dddddd;
            text-align: center;
            text-shadow: 0 2px 15px rgba(0, 0, 0, 0.7);
        }

        /* 5. 행 기준(Row-based) 자유 그리드 아카이브 뮤지엄 공간 */
        .archive-section {
            width: 100%;
            padding: 140px 60px;
            background-color: var(--bg-white); /* 대조적 미학을 위한 아카이브 영역 반전 */
            color: var(--bg-black);
        }

        .section-title {
            font-size: 2rem;
            margin-bottom: 60px;
            letter-spacing: 2px;
            border-left: 3px solid var(--point-color);
            padding-left: 20px;
            color: var(--bg-black);
        }

        .gallery-row-container {
            display: flex;
            flex-wrap: wrap;
            gap: 40px;
        }

        .archive-item {
            flex-grow: 1;
            position: relative;
            overflow: hidden;
            background-color: #e0e0e0;
            height: 420px;
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            will-change: transform;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        .archive-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.9;
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .archive-item:hover {
            transform: scale(1.02) translateY(-8px);
            box-shadow: 0 25px 50px rgba(0,0,0,0.15);
        }

        .archive-item:hover img {
            opacity: 1;
            filter: contrast(1.05) brightness(1.02);
        }

        .docent-script {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 35px;
            background: linear-gradient(to top, rgba(13, 13, 13, 0.95), transparent);
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            color: var(--bg-white);
        }

        .archive-item:hover .docent-script {
            opacity: 1;
            transform: translateY(0);
        }

        .docent-meta {
            font-family: monospace;
            font-size: 0.85rem;
            color: var(--point-color);
            margin-bottom: 6px;
            letter-spacing: 1px;
        }

        .docent-title {
            font-size: 1.25rem;
            font-weight: 500;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <div id="razor-cursor-h"></div>
    <div id="razor-cursor-v"></div>

    <header>
        <div class="logo">MAZENTA.C</div>
        <div class="menu-trigger">☰</div>
    </header>

    <section class="hero-section">
        <div class="cinematic-container">
            <div class="video-background">
                <iframe src="https://www.youtube.com/embed/9ZkDOZpzyhs?autoplay=1&mute=1&loop=1&playlist=9ZkDOZpzyhs&controls=0&start=266&modestbranding=1&showinfo=0&rel=0&iv_load_policy=3" 
                        allow="autoplay; encrypted-media" allowfullscreen></iframe>
            </div>
            <div class="hero-overlay"></div>
            
            <div class="hero-content">
                <h1 class="hero-title">우리 자아가 표상 안에서<br>마침내 <span>자유롭기를.</span></h1>
                <p class="hero-subtitle">1994 - 2026 : 장인을 넘어선 예술가, 정득묵</p>
            </div>
        </div>
    </section>

    <section class="archive-section">
        <h2 class="section-title">DIGITAL MUSEUM ARCHIVE</h2>
        <div class="gallery-row-container">
            <div class="archive-item" style="flex-basis: 600px;">
                <div style="width:100%; height:100%; display:flex; justify-content:center; align-items:center; background:#2c2c2c; color:#999; font-size: 0.9rem;">
                    [ ARCHIVE IMAGE 01 - DAMASCUS SERIE 1920x1080 ]
                </div>
                <div class="docent-script">
                    <div class="docent-meta">EST. 2022 / DAMASCUS STEEL</div>
                    <div class="docent-title">경계에 대한 고찰 연작 I</div>
                </div>
            </div>
            <div class="archive-item" style="flex-basis: 300px;">
                <div style="width:100%; height:100%; display:flex; justify-content:center; align-items:center; background:#333333; color:#999; font-size: 0.9rem;">
                    [ ARCHIVE IMAGE 02 - CHARRING VERTICAL 1080x1920 ]
                </div>
                <div class="docent-script">
                    <div class="docent-meta">EST. 2024 / CHARRING & FOSSIL</div>
                    <div class="docent-title">침묵의 단면 (사슴 뿔 나이프)</div>
                </div>
            </div>
        </div>
    </section>

    <script>
        // 십자 레이저 커서 마우스 동기화 및 트래킹
        const cursorH = document.getElementById('razor-cursor-h');
        const cursorV = document.getElementById('razor-cursor-v');

        window.addEventListener('mousemove', (e) => {
            cursorH.style.transform = `translate3d(${e.clientX}px, ${e.clientY}px, 0)`;
            cursorV.style.transform = `translate3d(${e.clientX}px, ${e.clientY}px, 0)`;
        });
    </script>
</body>
</html>

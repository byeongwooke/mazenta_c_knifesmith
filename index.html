<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAZENTA.C | GATE</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { width: 100vw; height: 100vh; overflow: hidden; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
        
        .split-gate { display: flex; width: 100%; height: 100%; }
        
        .gate-half {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-size: 3rem;
            font-weight: 300;
            letter-spacing: 0.2em;
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
        }

        /* 매트 다크 그레이 & 헌터 그린의 강렬한 대비 */
        .artwork-gate {
            background-color: #1A1A1A;
            color: #E0E0E0;
            border-right: 1px solid #2C2C2C;
        }
        
        .product-gate {
            background-color: #E0E0E0;
            color: #1A1A1A;
        }

        /* Hover Interaction: 깔끔한 직선적 기하학 라인 강조 */
        .artwork-gate:hover { background-color: #111111; color: #355E3B; font-weight: 400; }
        .product-gate:hover { background-color: #FFFFFF; color: #355E3B; font-weight: 400; }
    </style>
</head>
<body>
    <div class="split-gate">
        <a href="artwork.html" class="gate-half artwork-gate">ARTWORK</a>
        <a href="product.html" class="gate-half product-gate">PRODUCT</a>
    </div>
</body>
</html>

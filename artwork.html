<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAZENTA.C | ARTWORK</title>
    <style>
        :root {
            --bg-dark: #1A1A1A;
            --text-light: #E0E0E0;
            --accent-green: #355E3B; /* Hunter Green */
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: var(--bg-dark); color: var(--text-light); font-family: 'Noto Serif KR', serif; }

        header {
            padding: 40px 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(53, 94, 59, 0.3);
        }

        .logo a { color: var(--text-light); text-decoration: none; font-size: 1.2rem; font-weight: 300; letter-spacing: 2px; }
        .nav-btn a { color: var(--text-light); text-decoration: none; font-size: 0.9rem; letter-spacing: 1px; border: 1px solid var(--text-light); padding: 8px 16px; transition: 0.3s; }
        .nav-btn a:hover { background-color: var(--accent-green); border-color: var(--accent-green); }

        .museum-gallery {
            padding: 80px 60px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 60px;
            align-items: start;
        }

        .art-piece {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .art-piece img {
            width: 100%;
            height: auto;
            object-fit: cover;
            filter: grayscale(20%);
            transition: all 0.6s ease;
        }

        .art-piece:hover img { filter: grayscale(0%); transform: scale(1.02); }

        .art-caption {
            font-size: 0.85rem;
            color: #A0A0A0;
            border-left: 2px solid var(--accent-green);
            padding-left: 12px;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo"><a href="index.html">MAZENTA.C</a></div>
        <div class="nav-btn"><a href="index.html">BACK TO GATE</a></div>
    </header>

    <main class="museum-gallery" id="gallery-container">
        <!-- Antigravity 엔진이 mazenta 폴더 내부의 이미지를 호출하여 렌더링할 영역 -->
    </main>

    <script>
        // 향후 mazenta 폴더 내의 파일들을 동적으로 불러올 수 있도록 뼈대 마련
        const galleryContainer = document.getElementById('gallery-container');
        
        // 예시 배열 (실제 작업 시 mazenta 폴더의 파일명으로 매핑)
        const mockArtworks = ['work1.jpg', 'work2.jpg', 'work3.jpg', 'work4.jpg'];
        
        mockArtworks.forEach((art, index) => {
            const piece = document.createElement('div');
            piece.className = 'art-piece';
            piece.innerHTML = `
                <div style="width:100%; aspect-ratio: 4/5; background:#2C2C2C; display:flex; align-items:center; justify-content:center; color:#555;">
                    [ mazenta / ${art} ]
                </div>
                <div class="art-caption">
                    EXHIBITION ARCHIVE 0${index + 1}<br>
                    <span style="color:#E0E0E0;">Untitled, 2026</span>
                </div>
            `;
            galleryContainer.appendChild(piece);
        });
    </script>
</body>
</html>

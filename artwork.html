<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>MAZENTA.C | ARTWORK</title>
    <style>
        :root {
            --bg-color: #F5F5F3;
            --text-color: #1A1A1A;
            --accent-color: #355E3B;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background-color: var(--bg-color); 
            color: var(--text-color); 
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; 
            -webkit-tap-highlight-color: transparent; 
        }

        header {
            padding: 30px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(26, 26, 26, 0.1);
            position: sticky;
            top: 0;
            background-color: rgba(245, 245, 243, 0.95);
            backdrop-filter: blur(10px);
            z-index: 100;
        }

        .logo a { color: var(--text-color); text-decoration: none; font-size: 1.2rem; font-weight: 700; letter-spacing: 2px; }
        .nav-btn a { color: var(--text-color); text-decoration: none; font-size: 0.85rem; letter-spacing: 1px; font-weight: 500; transition: color 0.3s; }
        .nav-btn a:hover { color: var(--accent-color); }

        /* 순수 CSS 기반 Masonry 아카이브 갤러리 */
        .museum-gallery {
            padding: 60px 5%;
            column-count: 3;
            column-gap: 40px;
        }

        .art-piece {
            break-inside: avoid; /* 이미지가 열 사이에서 쪼개지는 현상 방지 */
            margin-bottom: 60px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            cursor: pointer;
        }

        .art-piece img {
            width: 100%;
            height: auto;
            object-fit: contain;
            background-color: #EAEAEA;
            transition: transform 0.4s ease;
        }

        .art-piece:hover img {
            transform: scale(1.02);
        }

        .art-caption {
            font-size: 0.85rem;
            color: #555555;
            border-left: 2px solid var(--accent-color);
            padding-left: 12px;
            line-height: 1.5;
            transition: color 0.3s ease;
        }

        .art-piece:hover .art-caption {
            color: var(--accent-color);
        }

        /* 모바일 및 태블릿 반응형 대응 */
        @media (max-width: 1024px) {
            .museum-gallery { column-count: 2; column-gap: 20px; }
            .art-piece { margin-bottom: 40px; }
        }
        
        @media (max-width: 768px) {
            .museum-gallery { column-count: 1; padding: 40px 5%; }
            .art-piece { margin-bottom: 40px; }
        }
    </style>
</head>
